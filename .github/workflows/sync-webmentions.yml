name: Sync Webmentions

on:
  schedule:
    - cron: "34 14 * * *"
  workflow_dispatch:
    inputs:
      sync_mode:
        description: "同期モード（定期実行は常にincremental）"
        required: true
        default: incremental
        type: choice
        options:
          - incremental
          - full

concurrency:
  group: "webmention-sync"
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Synchronize Webmention archive
        id: sync
        env:
          WEBMENTION_DOMAIN: nawashiro.dev
          WEBMENTION_IO_TOKEN: ${{ secrets.WEBMENTION_IO_TOKEN }}
          WEBMENTION_SYNC_MODE: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.sync_mode || 'incremental' }}
        run: |
          set -euo pipefail
          npm run webmentions:sync

          if git diff --quiet -- lib/data/webmentions.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Webmention archive is unchanged; skipping publication."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Webmention archive changed; publication will be triggered."
          fi

      - name: Commit Webmention archive
        if: steps.sync.outputs.changed == 'true'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/data/webmentions.json
          git commit -m "chore: update Webmention archive"
          git push

      - name: Trigger static publication
        if: steps.sync.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run nextjs.yml --ref main
